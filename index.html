<!-- Ce fichier est la page principale qui charge l'app et active la PWA -->
<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2e7d32" />
    <meta name="description" content="Signalement de collecte de déchets en Côte d'Ivoire" />
    <!-- Le manifest et le service worker sont générés et déclarés par vite-plugin-pwa
         (voir vite.config.js) : ne pas en ajouter ici, le navigateur ne lit que le
         premier <link rel="manifest"> et ignorerait celui du plugin. -->

    <!-- Installation PWA sur iPhone/iPad (iOS ignore le manifest pour l'icône) -->
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Poubelle-CI" />
    <title>Poubelle-CI</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
